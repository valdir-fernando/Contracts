name: Validate Contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testing_password
          MYSQL_DATABASE: contracts_validation
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, zip, bcmath, pdo_sqlite, pdo_mysql, gd, pcntl
          coverage: pcov
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: cp .env.example .env
      - run: mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs bootstrap/cache
      - run: composer install --no-interaction --prefer-dist
      - name: Audit locked PHP dependencies (all severities)
        run: composer audit --locked
      - run: vendor/bin/pint --test
      - name: Static analysis of Domain and Application
        run: composer check:static
      - name: Check architecture boundaries
        run: composer check:architecture
      - run: npm ci
      - name: Audit npm dependencies (including build tools)
        run: |
          audit_status=0
          npm audit --audit-level=high --json > npm-audit.json || audit_status=$?
          cat npm-audit.json
          exit "$audit_status"
      - name: Publish full npm advisory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: npm-audit.json
          if-no-files-found: ignore
      - run: npm run build
      - name: SQLite tests with line coverage (no artificial threshold)
        run: composer test:coverage
      - name: Publish coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/coverage/clover.xml
          if-no-files-found: ignore
      - name: Validate backup isolation
        run: python3 -m unittest discover -s tests/Operations -v
      - name: Test MySQL in isolated schema
        run: |
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          tree = ET.parse('phpunit.xml')
          node = tree.getroot().find('php')
          values = {'DB_CONNECTION': 'mysql', 'DB_DATABASE': 'contracts_validation', 'DB_HOST': '127.0.0.1', 'DB_USERNAME': 'root', 'DB_PASSWORD': 'testing_password'}
          for name, value in values.items():
              item = next((item for item in node.findall('env') if item.get('name') == name), None)
              if item is None:
                  item = ET.SubElement(node, 'env', {'name': name})
              item.set('value', value)
              item.set('force', 'true')
          tree.write('phpunit.mysql.xml')
          PYTHON
          vendor/bin/phpunit -c phpunit.mysql.xml
